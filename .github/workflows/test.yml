name: test
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JS 단위 시험
        run: node --test tests/js/*.test.mjs
      - name: Python 시험
        run: python -m unittest discover -s tests/py
